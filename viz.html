<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Galaxy</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font: 14px/1.4 system-ui, sans-serif;
    text-align: center; pointer-events: none;
    transition: opacity 2s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">click · drag · scroll to explore</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Galaxy parameters ───
const NUM_PARTICLES = 8000;
const ARMS = 4;
const ARM_SPREAD = 0.45;
const RADIUS = 300;

// ─── Mouse interaction ───
let mouse = { x: 0, y: 0, dx: 0, dy: 0, targetX: 0, targetY: 0 };
let rotation = 0;
let zoom = 1;
let autoRotate = true;

canvas.addEventListener('mousedown', () => { autoRotate = false; });
canvas.addEventListener('mouseup', () => { autoRotate = true; });
canvas.addEventListener('mousemove', (e) => {
  mouse.targetX = (e.clientX / W - 0.5) * 2;
  mouse.targetY = (e.clientY / H - 0.5) * 2;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= 1 - e.deltaY * 0.001;
  zoom = Math.max(0.3, Math.min(5, zoom));
}, { passive: false });

// ─── Build galaxy particles ───
const particles = [];
for (let i = 0; i < NUM_PARTICLES; i++) {
  const arm = i % ARMS;
  const armAngle = (arm / ARMS) * Math.PI * 2;

  // Distance from center — more particles near center
  const r = Math.pow(Math.random(), 1.2) * RADIUS;

  // Base angle on this arm plus some spiral
  const angle = armAngle + r * 0.015;

  // Random offset to make arms fuzzy
  const spread = (1 - r / RADIUS) * ARM_SPREAD + 0.08;
  const offsetAngle = (Math.random() - 0.5) * spread;
  const offsetR = (Math.random() - 0.5) * spread * 40;

  const finalR = Math.max(0, r + offsetR);
  const finalAngle = angle + offsetAngle;

  // Color: blue core → purple middle → pink/teal edge
  const t = r / RADIUS;
  let rCol, gCol, bCol;
  if (t < 0.3) {
    rCol = 100 + t * 200; gCol = 150 + t * 100; bCol = 255;
  } else if (t < 0.6) {
    rCol = 180 + (t - 0.3) * 200; gCol = 100 + (t - 0.3) * 100; bCol = 230 - (t - 0.3) * 150;
  } else {
    rCol = 220 + (t - 0.6) * 50; gCol = 180 - (t - 0.6) * 150; bCol = 100 + (t - 0.6) * 155;
  }

  // Size: larger near center
  const size = (1 - t * 0.7) * 2.5 + 0.3;

  // Z depth for parallax
  const z = (Math.random() - 0.5) * 200;

  particles.push({
    x: Math.cos(finalAngle) * finalR,
    y: Math.sin(finalAngle) * finalR,
    z,
    size,
    r: rCol, g: gCol, b: bCol,
    baseR: r,
    pulseSpeed: 0.5 + Math.random() * 2,
    pulseOffset: Math.random() * Math.PI * 2,
  });
}

// ─── Stars background ───
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 1.5,
    alpha: 0.3 + Math.random() * 0.7,
  });
}

// ─── Draw ───
function draw(time) {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, 0, W, H);

  // Fade in background stars
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha * 0.3})`;
    ctx.fill();
  });

  // Smooth mouse follow
  mouse.dx += (mouse.targetX - mouse.dx) * 0.05;
  mouse.dy += (mouse.targetY - mouse.dy) * 0.05;

  if (autoRotate) rotation += 0.0015;

  ctx.save();
  ctx.translate(W / 2 + mouse.dx * 100, H / 2 + mouse.dy * 100);
  ctx.scale(zoom, zoom);

  // Sort by z for depth
  const sorted = particles.map(p => {
    const cosR = Math.cos(rotation);
    const sinR = Math.sin(rotation);
    const xr = p.x * cosR - p.y * sinR;
    const yr = p.x * sinR + p.y * cosR;
    const zr = p.z;
    const perspective = 300 / (300 + zr);
    return { p, sx: xr * perspective, sy: yr * perspective, perspective, zr };
  }).sort((a, b) => a.zr - b.zr);

  const time_s = time * 0.001;

  sorted.forEach(({ p, sx, sy, perspective }) => {
    const pulse = 0.7 + 0.3 * Math.sin(time_s * p.pulseSpeed + p.pulseOffset);
    const alpha = Math.min(1, perspective * pulse);

    ctx.beginPath();
    ctx.arc(sx, sy, p.size * perspective * pulse, 0, Math.PI * 2);

    const r = Math.min(255, p.r + mouse.dx * 30);
    const g = Math.min(255, p.g + mouse.dy * 20);
    const b = Math.min(255, p.b);

    ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
    ctx.fill();

    // Glow on larger particles
    if (p.size > 1.8) {
      ctx.beginPath();
      ctx.arc(sx, sy, p.size * 3 * perspective, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.size * 3 * perspective);
      grad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${alpha * 0.2})`);
      grad.addColorStop(1, `rgba(${r|0},${g|0},${b|0},0)`);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  });

  // Core glow
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 60);
  coreGrad.addColorStop(0, `rgba(200,220,255,${0.3 + mouse.dx * 0.1})`);
  coreGrad.addColorStop(0.3, `rgba(150,180,255,0.1)`);
  coreGrad.addColorStop(1, 'rgba(150,180,255,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

// Fade out hint after a few seconds
setTimeout(() => {
  document.getElementById('info').style.opacity = '0';
}, 5000);

// ─── Keyboard shortcuts ───
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { zoom = 1; rotation = 0; }
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
</script>
</body>
</html>
